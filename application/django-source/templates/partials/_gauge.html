<div class="pw-gauge" role="img" aria-label="{{ value }} {{ caption }}">
    <svg viewBox="0 0 220 124" aria-hidden="true">
        <defs>
            <pattern id="hatch-{{ uid }}" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                <rect width="7" height="7" fill="#ffffff"/><rect width="2.6" height="7" fill="#8b968f"/>
            </pattern>
        </defs>
        <path d="M 22 110 A 88 88 0 0 1 198 110" pathLength="100" fill="none" stroke="#eef1ef" stroke-width="30" stroke-linecap="round"/>
        {% for s in segs %}
        <path d="M 22 110 A 88 88 0 0 1 198 110" pathLength="100" fill="none" stroke-width="30" stroke-linecap="round"
              stroke="{% if s.kind == 'done' %}#3f7f57{% elif s.kind == 'progress' %}#1f4d33{% else %}url(#hatch-{{ uid }}){% endif %}"
              stroke-dasharray="{{ s.len|floatformat:2 }} 200" stroke-dashoffset="{{ s.offset|floatformat:2 }}"/>
        {% endfor %}
    </svg>
    <div class="pw-gauge-center"><strong>{{ value }}</strong><span>{{ caption }}</span></div>
</div>
